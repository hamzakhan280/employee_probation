services:
  - type: web
    name: hr-portal
    env: python
    region: frankfurt  # or oregon, singapore - choose closest to your users
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn hr_project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        sync: false  # This will be set manually in the dashboard
      - key: EMAIL_HOST_USER
        sync: false  # This will be set manually in the dashboard
      - key: EMAIL_HOST_PASSWORD
        sync: false  # This will be set manually in the dashboard
      - key: OPENAI_API_KEY
        sync: false  # This will be set manually in the dashboard
      - key: DATABASE_URL
        fromDatabase: hr-portal-db  # Reference to the database service below
databases:
  - name: hr-portal-db
    plan: free
    region: frankfurt  # Match the region of your service
    databaseName: hr_portal_db
    user: hr_portal_user