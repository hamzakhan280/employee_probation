services:
- name: hr-portal
  type: web
  env: python
  buildCommand: pip install -r requirements.txt
  startCommand: python manage.py migrate && gunicorn hr_project.wsgi:application
  envVars:
  - key: DEBUG
    value: False
  - key: SECRET_KEY
    generateValue: true
  - key: ALLOWED_HOSTS
    value: your-app-name.onrender.com